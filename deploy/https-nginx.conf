# HTTPS 反向代理：转发到前端，让手机在安全来源下打开页面（麦克风只在 HTTPS 或
# localhost 下可用，语音通话靠它）。
#
# 两张证书，按 SNI 选：
#   * 默认（局域网 IP、Tailscale IP）：`certs/lan.crt`，由 `scripts/make-lan-cert.py`
#     签的根证书 `lan-ca.crt` 签发。手机装一次根证书就完全可信。
#   * `eidolon.example.com`：`tailscale cert` 签发的真证书（Tailscale 后台开了
#     HTTPS Certificates 之后才有）。有它时取消下面那段注释并重启 https 服务。
#
# 页面和 API 都走前端那一个端口，所以只转发到 frontend:3000。

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /certs/lan.crt;
    ssl_certificate_key /certs/lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    # 分享图、导出文件可能不小；通话信令是短请求。
    client_max_body_size 32m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 页面的流式回复走 SSE，别缓冲。
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# Tailscale 的真证书（`tailscale cert eidolon.example.com` 生成在 certs/ 下）：
# 家里、外面都用它，浏览器直接信任，不用装根证书。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR-TAILNET-HOSTNAME.ts.net;

    ssl_certificate     /certs/YOUR-TAILNET-HOSTNAME.ts.net.crt;
    ssl_certificate_key /certs/YOUR-TAILNET-HOSTNAME.ts.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
