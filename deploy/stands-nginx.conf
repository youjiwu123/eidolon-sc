# 立绘素材的静态服务（EIDOLON_STAND_ASSETS_URL）。
#
# 目录布局照存储桶的样子：
#   /spine/idols/<stand|stand_costume>/<enzaId>/   一套衣装的 data.json / data.atlas / data.png
#   /outfits/<idol_id>.json                        衣装清单（里面的相对路径是 ../spine/… 和 ../thumbnails/…）
#   /thumbnails/<category>/<enzaId>.png            换衣装面板的缩略图（可以不渲染，缺了就用占位）
#
# 必须带 CORS：通话层用 WebGL 画立绘，跨域贴图没有 CORS 头就加载不了。
server {
    listen 80;
    server_name _;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location /spine/ {
        alias /stands/source/assets/spine/;
        add_header Access-Control-Allow-Origin "*" always;
        # 衣装的文件内容不会变，和存储桶上的缓存策略一致
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /outfits/ {
        alias /stands/outfits/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        # 新卡会改这份清单
        add_header Cache-Control "no-cache" always;
    }

    location /thumbnails/ {
        alias /stands/thumbnails/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # 局域网 HTTPS 的根证书，给手机下载安装用（`scripts/make-lan-cert.py` 生成）。
    # 装上之后 `https://<局域网 IP>` 完全可信，麦克风可用。
    location = /ca.crt {
        alias /certs/lan-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="eidolon-ca.crt"' always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 落地页和通话层的音频与图（deploy.md「招呼」「来电卡图」「体素小人」「第 5 幕的静止图」）。
    # 文件不会自己出现：招呼和开场白要用 eidolon greeting upload 合成，其余手动放。
    location /greetings/     { alias /stands/greetings/;     add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /call-openers/  { alias /stands/call-openers/;  add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /call-posters/  { alias /stands/call-posters/;  add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400" always; }
    location /landing-voxels/{ alias /stands/landing-voxels/; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400" always; }
    location /landing-memory/{ alias /stands/landing-memory/; add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=86400" always; }

    location / {
        return 404;
    }
}
